compression: maximum
appId: com.floatpaste.app
productName: "存贴屋"
copyright: Copyright 2026 存贴屋

directories:
  output: dist
  buildResources: resources

files:
  - "out/**/*"
  - "!**/*.ts"
  - "!**/*.map"

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/tray.ico
    to: tray.ico
  - from: resources/tray.png
    to: tray.png

win:
  electronLanguages:
    - zh-CN
    - en-US
  target:
    - target: nsis
      arch: [x64]
  icon: icon.ico
  executableName: 存贴屋
  artifactName: "CunTieWu-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "存贴屋"
  uninstallDisplayName: "存贴屋"
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
